name: House style

# Dewald has asked four separate times for em dashes to be kept out of
# anything a member or a customer reads, and they have crept back in every
# time. Asking me to remember harder has not worked, so this checks instead.
#
# The first version of this only looked at email templates. That was too
# narrow: a sweep in July found em dashes in the onboarding wizard, the
# events forms, the review flow, every member page's section headings, and
# the AI prompt that drafts copy for new members. It now checks everything
# that ships.
#
# Comments are exempt, and so are console and Sentry calls. There are
# roughly a thousand em dashes in this codebase's comments and none of them
# reach a person. A check that fails on things nobody cares about gets
# switched off within a week.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-em-dashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fail if an em dash reaches a person
        run: node scripts/check-house-style.mjs
